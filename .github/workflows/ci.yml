name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

# Restrict default token permissions workflow-wide
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions: {}
    container:
      image: ghcr.io/inko-lang/inko@sha256:8a3a8c8364ffbc245c8753dc7533a3611ddc8280f1ad23ced686de1cb613e362
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Format check
        run: inko fmt --check

      - name: Build
        run: inko build --release src/recalldory.inko

      - name: Test
        run: inko test

      - name: Integration tests
        run: bash test/integration_test.sh

  release:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    container:
      image: ghcr.io/inko-lang/inko@sha256:8a3a8c8364ffbc245c8753dc7533a3611ddc8280f1ad23ced686de1cb613e362
    strategy:
      matrix:
        target:
          - amd64-linux-gnu
          - arm64-linux-gnu
          - amd64-linux-musl
          - arm64-linux-musl
          - amd64-mac-native
          - arm64-mac-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install SQLite
        run: dnf install -y sqlite-devel

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Add runtime
        env:
          TARGET: ${{ matrix.target }}
        run: inko runtime add "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: inko build --release --target "$TARGET" --linker zig src/recalldory.inko

      - name: Rename artifact
        env:
          TARGET: ${{ matrix.target }}
        run: mv "build/$TARGET/recalldory" "build/$TARGET/recalldory-$TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: recalldory-${{ matrix.target }}
          path: build/${{ matrix.target }}/recalldory-${{ matrix.target }}

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release and tag
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" artifacts/*
