name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

# Restrict default token permissions workflow-wide
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    container:
      image: ghcr.io/inko-lang/inko@sha256:5ec99fb0e6d7648293eed722f899dffaacfe0c15d91e64f4b5dbf758ab32db0f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Format check
        run: inko fmt --check

      - name: Install SQLite
        run: dnf install -y sqlite-devel

      - name: Build
        run: inko build --release src/recalldory.inko

      - name: Test
        run: inko test

      - name: Integration tests
        run: bash test/integration_test.sh

  release-linux:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    container:
      image: ghcr.io/inko-lang/inko@sha256:5ec99fb0e6d7648293eed722f899dffaacfe0c15d91e64f4b5dbf758ab32db0f
    strategy:
      matrix:
        target:
          - amd64-linux-gnu
          - arm64-linux-gnu
          - amd64-linux-musl
          - arm64-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install dependencies
        run: dnf install -y unzip xz

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build SQLite
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-sqlite.sh "$TARGET"

      - name: Add runtime
        env:
          TARGET: ${{ matrix.target }}
        run: inko runtime add "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: ulimit -n 10240 && inko build --release --target "$TARGET" --linker zig --linker-arg "-L$PWD/lib" --static src/recalldory.inko

      - name: Rename artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BINARY="$(find build -name recalldory -type f | head -1)"
          if [ -z "$BINARY" ]; then
            echo "Error: recalldory binary not found"
            find build -type f || true
            exit 1
          fi
          echo "Found binary at: $BINARY"
          mv "$BINARY" "build/recalldory-$TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: recalldory-${{ matrix.target }}
          path: build/recalldory-${{ matrix.target }}

  release-mac:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions: {}
    strategy:
      matrix:
        target:
          - amd64-mac-native
          - arm64-mac-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Inko
        run: brew install --HEAD inko

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build SQLite
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-sqlite.sh "$TARGET"

      - name: Add runtime
        env:
          TARGET: ${{ matrix.target }}
        run: inko runtime add "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          if echo "$TARGET" | grep -q amd64; then
            # Cross-compile x86_64: use system cc with target flag
            inko build --release --target "$TARGET" \
              --linker cc \
              --linker-arg "-target" \
              --linker-arg "x86_64-apple-macosx11.0" \
              --linker-arg "-L$PWD/lib" \
              --linker-arg "-F${SDK_PATH}/System/Library/Frameworks" \
              src/recalldory.inko
          else
            # Native arm64: use default linker
            inko build --release --target "$TARGET" \
              --linker-arg "-L$PWD/lib" \
              src/recalldory.inko
          fi

      - name: Rename artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BINARY="$(find build -name recalldory -type f | head -1)"
          if [ -z "$BINARY" ]; then
            echo "Error: recalldory binary not found"
            find build -type f || true
            exit 1
          fi
          echo "Found binary at: $BINARY"
          mv "$BINARY" "build/recalldory-$TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: recalldory-${{ matrix.target }}
          path: build/recalldory-${{ matrix.target }}

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [release-linux, release-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release and tag
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" artifacts/*